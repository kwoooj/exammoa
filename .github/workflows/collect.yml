# 하루 1회 일정·응시료 수집 배치. `docs/데이터-수집-활용.md` 가 전제하는 그 배치다.
#
# 산출물(`data/published/`)이 git 에 추적되기 때문에 이 워크플로가 성립한다. CI 는 매번
# 깨끗한 체크아웃에서 돌므로, 저장소에 이전 결과가 없으면 store.mjs 의 stale 폴백이
# 비교할 대상을 못 찾아 무동작이 된다.
#
# ⚠️ schedule 과 workflow_dispatch 는 **기본 브랜치에 있는 파일만** 발동한다.
#    기본 브랜치는 mvp 다 (2026-08-15 에 main 에서 옮겼다).
#    아래 DATA_BRANCH 는 체크아웃·푸시 대상이고 발동 조건과는 무관하다.
#
#    이 주석이 한때 기본 브랜치를 main 이라고 적어 놓고 파일은 mvp 에만 두었다.
#    그래서 아래 cron 수정이 **효력이 없었다** — main 의 옛 파일(04:10 KST)이 계속
#    발동했고 04:52 KST 런이 실패했다. 워크플로를 고쳤으면 기본 브랜치에 반영됐는지
#    확인한다. 브랜치에서 고치고 초록불을 본 것은 적용의 증거가 아니다.

name: 수집

on:
  schedule:
    # 22:10 UTC = 07:10 KST.
    #
    # 04:10 KST 였다가 옮겼다. 첫 스케줄 실행(04:58 KST)에서 apis.data.go.kr 이 47종목
    # 전부 `fetch failed`, historyexam.go.kr 이 타임아웃이었는데 **상용 도메인
    # (toeic·kbskorean)은 멀쩡했다.** 11시간 전 수동 실행(17:02 KST)에서는 둘 다 정상.
    # `.go.kr` 두 곳만 새벽에 동시에 죽는 시간대는 이유가 무엇이든 배치를 돌릴 때가 아니다.
    #
    # GitHub 스케줄은 30~60분 밀리는 일이 흔하므로 실제로는 07:40~08:10 KST 쯤 돈다.
    - cron: '10 22 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: '수집 결과를 커밋할 브랜치'
        default: mvp
        required: false

permissions:
  contents: write

# 겹쳐 돌면 같은 파일에 두 번 푸시한다. 앞 실행을 죽이지 않고 기다린다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      DATA_BRANCH: ${{ inputs.branch || 'mvp' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || 'mvp' }}

      # 수집 스크립트는 의존성이 없다 (node: 내장 모듈만). npm ci 를 돌리지 않는다.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: QNET_KEY 확인
        env:
          QNET_KEY: ${{ secrets.QNET_KEY }}
        run: |
          if [ -z "$QNET_KEY" ]; then
            echo "::error::QNET_KEY 시크릿이 없다. gh secret set QNET_KEY 로 등록하라."
            echo "값은 .env 와 같은 **URL 인코딩된 상태**(%3D%3D) 그대로 넣는다."
            exit 1
          fi

      # 종료코드 1 은 실패가 아니라 신호다. 산출물은 이미 쓰였고, 무엇을 할지는
      # 다음 스텝이 meta.json 을 보고 정한다.
      - name: 일정 및 응시료 수집
        id: collect
        continue-on-error: true
        env:
          QNET_KEY: ${{ secrets.QNET_KEY }}
        run: npm run collect

      - name: 판정
        id: gate
        run: node scripts/ci-gate.mjs

      - name: 커밋
        if: steps.gate.outputs.commit == 'true'
        env:
          SUBJECT: ${{ steps.gate.outputs.subject }}
        run: |
          git config user.name  'exammoa 수집 봇'
          git config user.email 'action@github.com'
          git add data/published data/archive
          if git diff --cached --quiet; then
            echo '변경 없음 — 커밋하지 않는다.'
            echo '변경 없음 — 오늘 기관 일정이 그대로다.' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "$SUBJECT" -m "하루 1회 수집 배치 (${{ github.workflow }} #${{ github.run_number }})"
            git push origin "HEAD:$DATA_BRANCH"
            echo "\`$DATA_BRANCH\` 에 커밋했다: $SUBJECT" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 산출물을 먼저 남긴 다음에 빨간불을 켠다 — collect.mjs 와 같은 순서다.
      - name: 실패 알림
        if: steps.gate.outputs.fail == 'true'
        run: |
          echo '::error::수집에 문제가 있다. 위 요약을 확인하라.'
          exit 1
